name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject GAS_URL Secret
        env:
          GAS_URL_VAL: ${{ secrets.GAS_URL }}
        run: |
          python3 -c "import os; val=os.environ.get('GAS_URL_VAL','').strip(); p='pwa_app.js'; f=open(p,'r'); c=f.read(); f.close(); f=open(p,'w'); f.write(c.replace('__GAS_URL__', val) if val else c); f.close()"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
