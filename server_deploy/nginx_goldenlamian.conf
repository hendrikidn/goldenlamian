# ==============================================================================
# Nginx Configuration: goldenlamian.dolanyu.com
# Serves:
# 1. PWA Attendance Web App on root (/)
# 2. HR Admin Portal (Streamlit + WebSockets) on (/admin/)
# 100% Isolated - Zero impact to dolanyu.com (Port 4100 / /var/www/dolanyu)
# ==============================================================================

server {
    listen 80;
    server_name goldenlamian.dolanyu.com;

    # --------------------------------------------------------------------------
    # 1. FRONTEND PWA ABSENSI (Karyawan)
    # --------------------------------------------------------------------------
    root /home/goldenlamian/pwa;
    index index.html;

    # Security Headers for Camera & Geolocation PWA
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression for fast asset transfers
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/octet-stream;
    gzip_min_length 256;

    # Aggressive Caching for AI Biometric Models (~7MB total)
    location /models/ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
    }

    # Anti-caching for Service Worker & Manifest (ensures PWA updates propagate instantly)
    location ~* (sw\.js|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # --------------------------------------------------------------------------
    # 2. BACKEND HR ADMIN PORTAL (Streamlit on Port 8502)
    # --------------------------------------------------------------------------
    location /admin {
        proxy_pass http://127.0.0.1:8502/admin;
        proxy_http_version 1.1;

        # Mandatory WebSocket upgrade headers for Streamlit interactive engine
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeouts for long-running report generations / syncs
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Streamlit core static assets & stream endpoint
    location ^~ /admin/_stcore/ {
        proxy_pass http://127.0.0.1:8502/admin/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 3. PWA FALLBACK (Single Page App)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
